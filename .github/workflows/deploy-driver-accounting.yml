name: Deploy Driver Accounting App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/islandcity-driver-accounting/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        working-directory: artifacts/islandcity-driver-accounting
        env:
          PORT: '3000'
        run: npx vite build --config vite.config.ts --base=/islandcity/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/islandcity-driver-accounting/dist/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
